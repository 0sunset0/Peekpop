name: Peekpop
options:
  bundleIdPrefix: com.peekpop
  deploymentTarget:
    iOS: "17.0"
targets:
  Peekpop:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Peekpop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peekpop.Peekpop
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Peekpop/Info.plist
  PeekpopTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PeekpopTests
      - path: TestFixtures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peekpop.PeekpopTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Peekpop
schemes:
  Peekpop:
    build:
      targets:
        Peekpop: all
        PeekpopTests: [test]
    test:
      targets:
        - PeekpopTests
